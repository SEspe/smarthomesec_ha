name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }}${{ matrix.ha != 'newest' && format(', HA {0}', matrix.ha) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pytest-homeassistant-custom-component is unpinned, so each Python
        # version gets the newest Home Assistant that supports it: 3.13 ->
        # 2026.2, 3.14 -> current. Without 3.14, CI never ran against a
        # current HA (found 2026-10-12, async_timeout). Python 3.12 is no
        # longer tested: HA 2026.1 requires Python 3.13.
        python-version: ["3.13", "3.14"]
        ha: [newest]
        include:
          # The minimum declared in hacs.json, tested for real rather than
          # assumed. Keep this in step with hacs.json "homeassistant".
          - python-version: "3.13"
            ha: "2026.1.0"
            harness: "pytest-homeassistant-custom-component==0.13.305"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Pin Home Assistant to ${{ matrix.ha }}
        if: matrix.harness
        run: pip install "${{ matrix.harness }}"

      - name: Run tests
        run: pytest --cov=custom_components/smarthomesec --cov-report=term-missing
